; Kai firmware for the M5StickS3 (ESP32-S3-PICO-1-N8R8: 8 MB flash, 8 MB octal PSRAM)
; Download mode: hold the side reset button ~2 s until the green LED blinks, then `pio run -t upload`.

[platformio]
default_envs = sticks3

[env:sticks3]
; pioarduino = Arduino-ESP32 3.x (the stock espressif32 platform is stuck on 2.x)
platform = https://github.com/pioarduino/platform-espressif32/releases/download/stable/platform-espressif32.zip
board = esp32-s3-devkitc-1
framework = arduino
board_build.arduino.memory_type = qio_opi
board_build.flash_mode = qio
board_build.partitions = default_8MB.csv
board_upload.flash_size = 8MB
board_upload.maximum_size = 8388608
build_flags =
    -DBOARD_HAS_PSRAM
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DARDUINO_USB_MODE=1
    -DCORE_DEBUG_LEVEL=1
lib_deps =
    m5stack/M5Unified@^0.2.23
    links2004/WebSockets@^2.7.3
    bblanchon/ArduinoJson@^7.4.3
monitor_speed = 115200
monitor_filters = esp32_exception_decoder
upload_speed = 1500000

; Measurement builds (docs/POWER.md). Release builds send no telemetry.
; telemetry: normal behaviour, plus battery/state reports every 30 s and deep-sleep stats on each wake.
[env:sticks3_telemetry]
extends = env:sticks3
build_flags = ${env:sticks3.build_flags} -DKAI_TELEMETRY

; powertest: telemetry, and never dims or deep-sleeps, so one state can be held for a rundown test.
[env:sticks3_powertest]
extends = env:sticks3
build_flags = ${env:sticks3.build_flags} -DKAI_TELEMETRY -DKAI_POWER_TEST
