; Kai firmware for the M5StickS3 (ESP32-S3-PICO-1-N8R8: 8 MB flash, 8 MB octal PSRAM)
; Download mode: hold the side reset button ~2 s until the green LED blinks, then `pio run -t upload`.

[platformio]
default_envs = sticks3

[env:sticks3]
; pioarduino = Arduino-ESP32 3.x (the stock espressif32 platform is stuck on 2.x). Pinned to a release (not
; "stable"), and every library to an exact version: an update is a deliberate edit, never a silent change.
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.312-1/platform-espressif32.zip
board = esp32-s3-devkitc-1
framework = arduino
board_build.arduino.memory_type = qio_opi
board_build.flash_mode = qio
board_build.partitions = default_8MB.csv
board_upload.flash_size = 8MB
board_upload.maximum_size = 8388608
build_flags =
    -DBOARD_HAS_PSRAM
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DARDUINO_USB_MODE=1
    -DCORE_DEBUG_LEVEL=1
lib_deps =
    m5stack/M5Unified@0.2.23
    m5stack/M5GFX@0.2.30
    links2004/WebSockets@2.7.3
    bblanchon/ArduinoJson@7.4.3
    ; libopus 1.6.1, fixed-point build (SILK encode is only real time in fixed point on the S3)
    https://github.com/pschatzmann/codec-opus.git#c02de6316dddbb9dffdf976c159c4eaacecdf12f
    ; Improv Wi-Fi: the web flasher page sets the Wi-Fi over USB (Apache-2.0)
    https://github.com/improv-wifi/sdk-cpp.git#8e87b560bd5dd7de296847538ea11edb70401d65
    ; Monocypher 4.0.2 (BSD-2 / CC0): X25519, SHA-512 and HKDF for pairing with a code
    https://github.com/LoupVaillant/Monocypher.git#0d85f98c9d9b0227e42cf795cb527dff372b40a4
; Adds TLS-PSK (the encrypted link to the relay) to the WebSockets library; see the script.
extra_scripts = pre:scripts/patch_websockets.py
monitor_speed = 115200
monitor_filters = esp32_exception_decoder
upload_speed = 1500000

; Measurement builds (docs/POWER.md). Release builds send no telemetry.
; telemetry: normal behaviour, plus battery/state reports every 30 s and deep-sleep stats on each wake.
[env:sticks3_telemetry]
extends = env:sticks3
build_flags = ${env:sticks3.build_flags} -DKAI_TELEMETRY

; powertest: telemetry, and never dims or deep-sleeps, so one state can be held for a rundown test.
[env:sticks3_powertest]
extends = env:sticks3
build_flags = ${env:sticks3.build_flags} -DKAI_TELEMETRY -DKAI_POWER_TEST

; Host-side unit tests for the pure logic in src/*.h (no hardware): pio test -e native
[env:native]
platform = native
test_framework = unity
build_flags = -std=c++17 -I src
build_src_filter = -<*> +<pairing_crypto.cpp>
test_build_src = yes
lib_deps =
    https://github.com/improv-wifi/sdk-cpp.git#8e87b560bd5dd7de296847538ea11edb70401d65
    ; Monocypher 4.0.2 (BSD-2 / CC0): X25519, SHA-512 and HKDF for pairing with a code
    https://github.com/LoupVaillant/Monocypher.git#0d85f98c9d9b0227e42cf795cb527dff372b40a4
