[project]
name = "kai-relay"
version = "0.11.0"
description = "Home relay between the Kai M5StickS3 and the Gemini Live API"
requires-python = ">=3.11"
license = "MIT"
dependencies = [
    "google-genai>=2.0",
    "websockets>=14",
    "httpx>=0.27",
    "astral>=3.2",
    "python-dotenv>=1.0",
    "av>=14",          # bundled libopus for the Stick's Opus audio
    "numpy>=1.26",
    "mcp==2.0.0",       # Kai MCP server for Hermes (same pin as Hermes itself)
    "uvicorn>=0.30",
]

[project.optional-dependencies]
# Talk to the relay from your Mac's mic/speakers before the Stick is flashed.
sim = ["sounddevice>=0.5"]

[project.scripts]
kai-relay = "kai_relay.server:main"
kai-sim = "kai_relay.sim_device:main"
kai-power = "kai_relay.power:main"
kai-psk = "kai_relay.tls:main"

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
markers = ["network: hits real public APIs"]
addopts = "-m 'not network'"
