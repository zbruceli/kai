# Hermes Agent: Kai's "slow path" brain (memory, background tasks, schedules). See README.md here.
#
#   cd ~/kai/relay/deploy/hermes && docker compose up -d
#
# Isolation: Hermes sees only its data folder. No home directory, no SSH keys, no Docker socket, so even a
# tool-restriction failure can't reach the host (the host user is in the docker group, i.e. root-equivalent).
# Host networking lets it reach the relay's Kai MCP server on 127.0.0.1:8766 and keep its own API server on
# 127.0.0.1:8642; nothing listens on the LAN.
name: kai-hermes  # fixed project name, so it doesn't matter which directory compose runs from
services:
  hermes:
    # Pinned by tag and digest: an update is a deliberate edit here, never a silent re-pull.
    image: nousresearch/hermes-agent:v2026.9.24@sha256:fca358f12efd65bfaaca05884166f15c0e2788375ca30d77061ac1ebc96452b7
    container_name: kai-hermes
    command: ["gateway", "run"]  # the API server lives in the gateway; the default is an interactive chat
    restart: unless-stopped
    network_mode: host
    volumes:
      - ${KAI_HERMES_HOME:-~/kai-hermes}:/opt/data
    environment:
      - HERMES_UID=${HERMES_UID:-1000}
      - HERMES_GID=${HERMES_GID:-1000}
      - TZ=America/Los_Angeles
    security_opt:
      - no-new-privileges:true
    mem_limit: 2g
    pids_limit: 512
